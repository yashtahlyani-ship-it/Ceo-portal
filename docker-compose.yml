# GyFTR CEO Office Portal — local / single-host orchestration
# Frontend and backend are separate images with separate ports/URLs, matching
# the Marketing and Legal portals.
#
# Usage:
#   cp .env.example .env   # fill in values
#   docker compose up --build
#
# Prod URLs: frontend https://ceo.gyftr.net | backend https://ceo-api.gyftr.net
# Local:     frontend http://localhost:7868 | backend http://localhost:7869
#
# Port map across the family (keep these distinct so they can share a host):
#   Marketing  frontend 7867  backend 7878
#   Legal      frontend 7979  backend 7978
#   CEO Office frontend 7868  backend 7869
#
# A local `postgres` service is included so the stack runs end to end without
# an RDS instance. It is for development only — see the comment on it.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gyftr-ceo-postgres
    # DEVELOPMENT ONLY. Deployed environments use RDS, and the backend reaches
    # it via AWS_SECRET_NAME rather than these variables. Do not point a real
    # environment at this container: the volume below is the only copy of the
    # data and nothing backs it up.
    environment:
      POSTGRES_DB: gyftr_ceo
      POSTGRES_USER: gyftr_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdev}
    ports:
      - "5442:5432"   # non-default host port so it cannot collide with a local Postgres
    volumes:
      - ceo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyftr_admin -d gyftr_ceo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    platform: linux/arm64
    build:
      context: ./backend
    image: gyftr-ceo-portal-api
    container_name: gyftr-ceo-portal-backend
    ports:
      - "7869:7869"
    env_file:
      - .env
    environment:
      PORT: 7869
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:7868}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gyftr_ceo
      DB_USER: gyftr_admin
      DB_PASSWORD: ${DB_PASSWORD:-localdev}
      # NOT production. Turning this on would enable TLS to Postgres, which the
      # local container does not serve — and the backend applies migrations on
      # boot either way.
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7869/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    platform: linux/arm64
    build:
      context: ./frontend
      args:
        # Vite inlines these at BUILD time. Setting them as `environment:`
        # would do nothing — the bundle is already compiled by then.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:7869}
        VITE_COGNITO_USER_POOL_ID: ${VITE_COGNITO_USER_POOL_ID}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID}
    image: gyftr-ceo-portal-frontend
    container_name: gyftr-ceo-portal-frontend
    ports:
      - "7868:7868"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7868/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ceo-pgdata:
